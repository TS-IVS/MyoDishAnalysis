# Self tests of the MATLAB and the Python version on every push and pull request.
# MATLAB on GitHub-hosted runners is free of charge for public repositories (batch use).
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e "py[all]"
      - name: Self test
        run: mda-test
      - name: pytest (incl. comparison with the MATLAB results on the example recordings)
        shell: bash
        run: python -m pytest -q -rfE --tb=short py/tests 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - name: Report pytest failures as annotations
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          lines = open("pytest.log", encoding="utf-8", errors="replace").read().splitlines()
          bad = [l for l in lines if l.startswith(("FAILED", "ERROR", "E   "))][:40] or lines[-40:]
          print("::error title=pytest::" + "%0A".join(l.replace("%", "%25") for l in bad))
          PY
          python py/tests/compare_matlab.py ex1 ex3 ex6 > compare.log 2>&1 || true
          python - <<'PY'
          lines = open("compare.log", encoding="utf-8", errors="replace").read().splitlines()
          keep = [l for l in lines if "rocker" in l and ("DIFF" in l or "sample" in l or "summary" in l or "largest" in l)][:40]
          print("::warning title=compare_matlab rocker::" + "%0A".join(l.replace("%", "%25") for l in keep))
          PY

  matlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath(pwd); assert(mda_test(), 'mda_test failed'); assert(mda_testClockTime(), 'mda_testClockTime failed'); assert(mda_testSignalGaps(), 'mda_testSignalGaps failed'); assert(mda_testSliceRegister(), 'mda_testSliceRegister failed'); assert(mda_testSpikes(), 'mda_testSpikes failed'); assert(mda_testProtocolEnd(), 'mda_testProtocolEnd failed'); assert(mda_testWatch(), 'mda_testWatch failed')
